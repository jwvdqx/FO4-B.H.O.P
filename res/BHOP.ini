; B.H.O.P. - Boston Hopping Overhaul Project v0.2.0
; Edit and restart the game. (The MCM page comes in a later stage.)

[General]
; 0 = Vanilla Fallout 4, 1 = Half-Life 1, 2 = Half-Life 2
iMode=2
; Writes test info to Documents\My Games\Fallout4\F4SE\BHOP.log.
; Keep this on for the first tests.
bDebugLog=1
; Use Half-Life movement in Power Armor too (it will feel heavier, see below)
bEnableInPowerArmor=1
; When a wall or NPC stops you, you lose that speed (like Half-Life)
bWallClip=1

[Ground]
; Leave at -1 to use the selected game's values.
; Half-Life 1 and 2 both use: friction 4, accelerate 10, stop speed 100
; Tick rate: Half-Life 1 = 100, Half-Life 2 = 66.67
fFriction=-1
fAccelerate=-1
fStopSpeed=-1
fTickRate=-1

[Weight]
; Heavier loads make you slower to start, turn and stop
bCarryWeightAffectsMovement=1
fFullLoadAccelMult=0.55
fOverencumberedAccelMult=0.40
fFullLoadFrictionMult=0.85
fPowerArmorAccelMult=0.60
fPowerArmorFrictionMult=0.80

[Sounds]
; THE TOGGLE: 1 = Half-Life footstep/jump/landing sounds for the player, 0 = vanilla
bHalfLifeSounds=1
; 0 = match iMode (HL1 mode -> HL1 sounds, HL2 mode -> HL2 sounds, Vanilla -> no HL sounds)
; 1 = always Half-Life 1 sounds, 2 = always Half-Life 2 sounds (also works with iMode=0)
iSoundSet=0
; Mute the player's vanilla footsteps while Half-Life sounds are on (NPCs are never touched)
bMuteVanillaPlayerFootsteps=1
; Floor sound when you jump and land, like Half-Life
bJumpLandSounds=1
; Slosh / wade sounds in shallow water
bWaterSounds=1
; Half-Life swim sounds (off: Fallout already has swim sounds)
bSwimSounds=0
; Half-Life 2 only: Power Armor steps use the Combine "hardboot" sounds
bPowerArmorHardboot=1
; Half-Life 1 only: pl_fallpain3 on a hard fall
bHL1FallPainSound=1

; Volume of all Half-Life sounds (1.0 = as loud as Half-Life plays them)
fVolume=1.0
; Half-Life's own step volumes
fRunVolume=0.5
fWalkVolume=0.2
fSneakVolumeMult=0.5
; Step timing (seconds), Half-Life's values
fRunStepInterval=0.3
fWalkStepInterval=0.4
fSneakExtraInterval=0.1
fWaterStepInterval=0.6
; Speed (Half-Life units/s) where steps switch to "running". Half-Life uses 220,
; lowered because Fallout's slower walk/run speeds are still used for now.
fRunStepSpeed=140
fMinStepSpeed=10
; Landing: falls faster than these (Half-Life units/s) make a sound
fLandSoftSpeed=150
fLandHardSpeed=350
fFallPainSpeed=580

; Surface -> sound. The log lists every Fallout material and what it uses.
; To change one, add a line: Material.<name from the log>=<sound>
; Sounds: concrete, metal, grate, chainlink, duct, wood, woodpanel, grass, gravel,
;         mud, sand, snow, dirt, tile, slosh, wade, carpet
; Example:
;Material.materialcarpet=carpet

[Advanced]
; Don't change unless told to.
fUnitScale=0.0254
iFileSoundFlags=0x1A
iFilePriority=1
