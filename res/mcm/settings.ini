; B.H.O.P. - Boston Hopping Overhaul Project v1.0.0
; Default settings. Change them in-game from Mod Config -> B.H.O.P. (saved to Data\MCM\Settings\BHOP.ini).
; Without MCM you can edit this file instead (restart, or open and close the pause menu).

[General]
; 0 = Vanilla Fallout 4, 1 = Half-Life 1, 2 = Half-Life 2
iMode=2
; How the movement math runs:
; 0 = exact Half-Life tick rate (can feel steppy at 40-60 fps)
; 1 = exact tick rate, smoothed between ticks (adds up to one tick of delay)
; 2 = every frame (smoothest and most responsive, default)
iSmoothing=2
; Read the stick directly instead of waiting for Fallout's own speed-up/slow-down (much less input delay).
; First person only; third person uses Fallout's direction (it turns your body).
bDirectInput=1
; Walk/run/sprint speeds: 0 = Fallout's own, 1 = Half-Life's (HL2: walk 150, run 190, sprint 320; HL1: run 320)
iSpeedMode=0
; Half-Life 1 speeds only: 0 = sprint key does nothing (HL1 has no sprint), 1 = sprint is faster
iHL1Sprint=0
fHL1SprintMult=1.35
; Half-Life speeds only: speed in Power Armor
fHLPowerArmorSpeedMult=0.85
; Writes test info to Documents\My Games\Fallout4\F4SE\BHOP.log.
bDebugLog=1
; Use Half-Life movement in Power Armor too
bEnableInPowerArmor=1
; When a wall or NPC stops you, you lose that speed (like Half-Life)
bWallClip=1

[Ground]
; Grip: multiplies friction and acceleration. 1.0 = exact Half-Life, higher = snappier/less slide.
fResponsiveness=1.3
; 0 = use the selected game's values (Half-Life 1 and 2 both use friction 4, accelerate 10, stop speed 100)
; 1 = use the values below
bCustomGround=0
fFriction=4
fAccelerate=10
fStopSpeed=100
; Tick rate: -1 = the game's own (Half-Life 1 = 100, Half-Life 2 = 66.67). Used by iSmoothing 0 and 1.
fTickRate=-1

; Surfaces change grip, like Source's surface friction (ice slides, mud and snow drag)
bSurfaceFriction=1
; 0 = no effect, 1 = full effect
fSurfaceFrictionStrength=1.0

[Air]
; Half-Life air control: momentum is kept in the air and you can air strafe
bAirControl=1
; sv_airaccelerate (Half-Life: 10)
fAirAccelerate=10
; Half-Life caps the air wish speed at 30. Don't change for real Half-Life air strafing.
fAirSpeedCap=30
; Help for sticks: when you strafe and turn the same way, aim the strafe at the best angle.
; 0 = pure Half-Life (very hard on a stick), 1 = full help
fStrafeAssist=0.5
; Bunnyhop: no friction for a moment after landing, so jumping again keeps your speed
bBunnyhop=1
; Seconds after landing without friction (Half-Life: one frame; a little more is kinder on a stick)
fBhopGrace=0.10
; Half-Life 1: jumping above 1.7x max speed cuts you back (the HL1 bunnyhop cap)
bHL1BhopCap=1
; Half-Life 2: the forward speed boost when you jump
bHL2JumpBoost=1
; Half-Life 2: keep the boost's backwards quirk (accelerated back-hopping, ABH)
bHL2ABH=1

[Perks]
; Vanilla perks: 0 = off, 1 = bonus (everything works, perks make it better),
; 2 = unlock (air control needs Agility 5, bunnyhop needs Moving Target 1, ABH needs Moving Target 3)
; Moving Target: faster sprint. Strong Back: weight slows you less. Adamantium Skeleton: softer landing tilt.
; Aquaboy/Aquagirl: no water drag. Sneak: quieter Half-Life steps. Agility: better air control.
iPerkMode=1

[Weight]
; Heavier loads make you slower to start and turn
bCarryWeightAffectsMovement=1
; Acceleration at a full load (1.0 = no change)
fFullLoadAccelMult=0.80
fOverencumberedAccelMult=0.60
; Friction at a full load (lower = slide more when stopping; 1.0 = no change)
fFullLoadFrictionMult=1.0
fPowerArmorAccelMult=0.75
fPowerArmorFrictionMult=1.0

[Camera]
; Half-Life view effects, first person only.
; 0 = off, 1 = like the game (Half-Life 1 has them, Half-Life 2 doesn't), 2 = always on
iViewBob=1
fBobScale=1.0
iViewRoll=1
; Half-Life 1: cl_rollangle 2, cl_rollspeed 200
fRollAngle=2.0
fRollSpeed=200
; Camera tilts on hard landings, like Half-Life
bLandingPunch=1
fPunchScale=1.0

[Sounds]
; THE TOGGLE: 1 = Half-Life footstep/jump/landing sounds for the player, 0 = vanilla
bHalfLifeSounds=1
; 0 = match iMode (HL1 mode -> HL1 sounds, HL2 mode -> HL2 sounds, Vanilla -> no HL sounds)
; 1 = always Half-Life 1 sounds, 2 = always Half-Life 2 sounds (also works with iMode=0)
iSoundSet=0
; Mute the player's vanilla footsteps while Half-Life sounds are on (NPCs are never touched)
bMuteVanillaPlayerFootsteps=1
; Floor sound when you jump and land, like Half-Life
bJumpLandSounds=1
; Slosh / wade sounds in shallow water
bWaterSounds=1
; Half-Life swim sounds (off: Fallout already has swim sounds)
bSwimSounds=0
; Half-Life 2 only: Power Armor steps use the Combine "hardboot" sounds
bPowerArmorHardboot=1
; Half-Life 1 only: pl_fallpain3 on a hard fall
bHL1FallPainSound=1
; Give the Half-Life sounds the same reverb/distance settings as vanilla footsteps (incl. reverb mods)
bUseVanillaReverb=1

; Volume of all Half-Life sounds (1.0 = as loud as Half-Life plays them)
fVolume=1.0
; Half-Life's own step volumes
fRunVolume=0.5
fWalkVolume=0.2
fSneakVolumeMult=0.5
; Step timing (seconds), Half-Life's values
fRunStepInterval=0.3
fWalkStepInterval=0.4
fSneakExtraInterval=0.1
fWaterStepInterval=0.6
; Speed (Half-Life units/s) where steps switch to "running". Half-Life uses 220,
; lowered because Fallout's slower walk/run speeds are still used for now.
fRunStepSpeed=140
fMinStepSpeed=10
; Landing: falls faster than these (Half-Life units/s) make a sound
fLandSoftSpeed=150
fLandHardSpeed=350
fFallPainSpeed=580

; Surface -> sound. The log lists every Fallout material and what it uses.
; To change one, add a line: Material.<name from the log>=<sound>
; Sounds: concrete, metal, grate, chainlink, duct, wood, woodpanel, grass, gravel,
;         mud, sand, snow, dirt, tile, slosh, wade, carpet
; Example:
;Material.materialcarpet=carpet

[Advanced]
; Don't change unless told to.
fUnitScale=0.0254
iFileSoundFlags=0x1A
iFilePriority=1
