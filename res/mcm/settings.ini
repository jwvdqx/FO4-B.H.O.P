; B.H.O.P. - Boston Hopping Overhaul Project v1.6.0
; Default settings. Change them in-game from Mod Config -> B.H.O.P. (saved to Data\MCM\Settings\BHOP.ini).
; Without MCM you can edit this file instead (restart, or open and close the pause menu).

[General]
; Master switch: 0 = plain Fallout 4 (no Half-Life movement, camera or sounds); your settings are kept
bEnabled=1
; Profile: 0 = your own settings (everything in this file / the MCM menu)
; 1 = full Half-Life 1, 2 = full Half-Life 2 (the original game: its speeds, its jump, exact timing, no helpers, no perks)
; 3 = Claude's choice (Half-Life 2 feel tuned for Fallout and gamepads)
; Profiles 1-3 are ready-made and never change your own settings: set 0 again to get them back.
iProfile=0
; 0 = Vanilla Fallout 4, 1 = Half-Life 1, 2 = Half-Life 2
iMode=2
; How the movement math runs:
; 0 = exact Half-Life tick rate (can feel steppy at 40-60 fps, adds up to one tick of delay)
; 1 = exact tick rate, smoothed between ticks (adds up to one tick of delay)
; 2 = every frame, split into Half-Life-sized steps done right away: Half-Life's results at any frame rate,
;     no added delay (default)
iSmoothing=2
; Read the stick directly instead of waiting for Fallout's own speed-up/slow-down (much less input delay).
; First person only; third person uses Fallout's direction (it turns your body).
bDirectInput=1
; Walk/run/sprint speeds: 0 = Fallout's own, 1 = Half-Life's (HL2: walk 150, run 190, sprint 320; HL1: run 320)
iSpeedMode=0
; Half-Life 1 speeds only: 0 = sprint key does nothing (HL1 has no sprint), 1 = sprint is faster
iHL1Sprint=0
fHL1SprintMult=1.35
; Base speed cap (Half-Life units/s, 0 = none): your base walk/run/sprint speed never goes above this.
; Buffs, chems, Power Armor and perks apply after the cap. (Fallout's run is about 210, sprint 280.)
fBaseSpeedCap=0
; Half-Life speeds only: speed in Power Armor
fHLPowerArmorSpeedMult=0.85
; Troubleshooting: writes test info to Documents\My Games\Fallout4\F4SE\BHOP.log. Off for normal play.
bDebugLog=0
; Recording for tuning: each time you close the pause menu with this on, the next fRecordSeconds of
; movement are written step by step to Documents\My Games\Fallout4\F4SE\BHOP_record.csv. Off for normal play.
bRecord=0
fRecordSeconds=15
; Use Half-Life movement in Power Armor too
bEnableInPowerArmor=1
; When a wall or NPC stops you, you lose that speed (like Half-Life)
bWallClip=1
; Experiment: when you hit a wall, check the real wall surface to get its exact direction
; (better wall slides). Off = use the guess from how you moved.
bWallProbe=1
; Half-Life slopes: on slopes up to this steep (degrees) you keep your heading and your speed, you just
; climb, instead of being turned sideways and slowed when you cross one at an angle.
; Half-Life 1 and 2 both use 45.57. 0 = off (Fallout's slopes).
fSlopeAngle=45
; Swimming: 0 = Fallout's, 1 = Half-Life's (default): swim speed, momentum and water friction like Half-Life.
; Fallout still handles floating and diving (look down and swim to dive).
iSwimMode=1
; Water surfing: hold jump at the surface while moving faster than you can swim (after a bunnyhop, a jump
; or a slide into water) and you skim along keeping your speed, like Half-Life. Needs Half-Life swimming.
bWaterSurf=1

[Ground]
; Grip: multiplies friction and acceleration. 1.0 = exact Half-Life.
; The default 1.3 is a B.H.O.P. preset (snappier, less slide), because Half-Life values feel slippery at Fallout speeds.
fResponsiveness=1.3
; 0 = use the selected game's values (Half-Life 1 and 2 both use friction 4, accelerate 10, stop speed 100)
; 1 = use the values below
bCustomGround=0
fFriction=4
fAccelerate=10
fStopSpeed=100
; Tick rate: -1 = the game's own (Half-Life 1 = 100, Half-Life 2 = 66.67). The size of each
; Half-Life step, for both ground and air movement.
fTickRate=-1

; Surfaces change grip, like Source's surface friction (ice slides, mud and snow drag)
bSurfaceFriction=1
; 0 = no effect, 1 = full effect
fSurfaceFrictionStrength=1.0

; Half-Life 1 edge friction: friction doubles when there's no floor just ahead (stops you at ledges).
; 0 = off, 1 = Half-Life 1 mode only (like the original; HL2 removed it), 2 = both modes
iEdgeFriction=0
; sv_edgefriction (Half-Life 1: 2)
fEdgeFrictionMult=2

[Air]
; Half-Life air control: momentum is kept in the air and you can air strafe
bAirControl=1
; sv_airaccelerate (Half-Life: 10)
fAirAccelerate=10
; Half-Life caps the air wish speed at 30. Don't change for real Half-Life air strafing.
fAirSpeedCap=30
; Help for sticks: when you strafe and turn the same way, aim the strafe at the best angle.
; 0 = pure Half-Life (very hard on a stick), 1 = full help
fStrafeAssist=0.5
; Bunnyhop: no friction for a moment after landing, so jumping again keeps your speed
bBunnyhop=1
; Seconds after landing without friction. The original games give you one frame (HL2: 0.015 s).
; The default 0.05 (about 3 HL2 frames) keeps it a skill but doable on a stick. Set 0.015 for the original.
; Each rank of Action Boy/Action Girl adds 0.025 s (with perks on).
fBhopGrace=0.05
; Jump buffer: jump pressed up to this many seconds before landing still jumps as you touch down (0 = off)
fJumpBuffer=0.1
; Ledge jump: seconds after running off an edge you can still jump (0 = off). Not in Power Armor.
fLedgeJump=0.1
; Auto-jump (hold jump to keep hopping): 0 = off, 1 = with Action Boy/Girl at max rank, 2 = always
iAutoJump=1
; Half-Life 1: jumping above 1.7x max speed cuts you back (the HL1 bunnyhop cap)
bHL1BhopCap=1
; Half-Life 2: the forward speed boost when you jump
bHL2JumpBoost=1
; Half-Life 2: keep the boost's backwards quirk (accelerated back-hopping, ABH)
bHL2ABH=1
; Half-Life 2: while you rise slowly (under 140 units/s), air acceleration is quartered, as in Source.
; 0 = off, 1 = exact (140 units/s), 2 = scaled to Fallout's own jump speed
iHL2AirFriction=2
; Jumping and gravity in the air:
; 0 = Fallout's (default)
; 1 = Half-Life gravity, Fallout's jump height (same height, quicker jump: HL1 800, HL2 600 units/s2)
; 2 = exact Half-Life (HL1 jumps 45 units high, HL2 only 21: duck-jump to get onto things)
; Falling also uses it: fall damage may change, please test.
iJumpPhysics=0

; Crouch-jump: press sneak in the air to lift your feet, like Half-Life's duck-jump (reach higher ledges).
; Works while rising and for a moment after the top of the jump, once per jump.
bCrouchJump=1
; Extra height: 0 = exact per game (HL1 +18 units, HL2 +36 units), 1 = the same share of Fallout's own jump
iCrouchJumpHeight=0
; Seconds after the top of the jump it still works
fCrouchJumpWindow=0.15
; Land sneaking after a crouch-jump (Half-Life keeps you ducked)
bCrouchLandSneak=1
; Crouch-jump with: 0 = the sneak key, 1 = the sneak key, or jump pressed again while still going up
iCrouchJumpKey=1

; Pushes from hits, explosions and scripts add to your momentum (Half-Life style), then friction slows them.
bPushes=1
; Sudden extra speed (HL units/s in one step) that counts as a push. Lower = more sensitive.
fPushThreshold=60

[Perks]
; Vanilla perks: 0 = off, 1 = bonus (everything works, perks make it better),
; 2 = unlock (air control needs Agility 5, bunnyhop needs Moving Target 1, ABH needs Moving Target 3).
;     Unlock also includes all the bonus effects.
; Moving Target: faster sprint. Strong Back: weight slows you less. Adamantium Skeleton: softer landing tilt.
; Aquaboy/Aquagirl: no water drag. Sneak: quieter Half-Life steps. Agility: better air control.
; Action Boy/Girl: wider bunnyhop window per rank; at max rank, hold jump to bunnyhop automatically.
iPerkMode=1
; On-screen notes showing your perks are picked up: 0 = off, 1 = when you gain a rank, 2 = also one line after loading
iPerkMessages=2
; The perks are found by their ID first (works in any language and with perk mods that edit the vanilla
; perks), then by the names below. Add names or form IDs like 0x0004D869 if a mod replaced a perk with its
; own ('|' between alternatives).
sPerkMovingTarget=moving target
sPerkStrongBack=strong back
sPerkAdamantiumSkeleton=adamantium skeleton
sPerkAquaboy=aquaboy|aquagirl
sPerkSneak=sneak
sPerkActionBoy=action boy|action girl

[Weight]
; Heavier loads make you slower to start and turn
bCarryWeightAffectsMovement=1
; Acceleration at a full load (1.0 = no change)
fFullLoadAccelMult=0.80
fOverencumberedAccelMult=0.60
; Friction at a full load (lower = slide more when stopping; 1.0 = no change)
fFullLoadFrictionMult=1.0
fPowerArmorAccelMult=0.75
fPowerArmorFrictionMult=1.0

[Camera]
; Fallout's own first person camera movement (it comes from its animations: the dip and shake when you jump
; and land, the sprint sway): 0 = keep, 1 = off while jumping and landing (default), 2 = always off
iFalloutCameraMotion=1
; Half-Life view effects, first person only.
; 0 = off, 1 = like the game (Half-Life 1 has them, Half-Life 2 doesn't), 2 = always on
iViewBob=1
fBobScale=1.0
iViewRoll=1
; Half-Life 1: cl_rollangle 2, cl_rollspeed 200
fRollAngle=2.0
fRollSpeed=200
; Camera tilts on hard landings, like Half-Life
bLandingPunch=1
fPunchScale=1.0

[Sounds]
; THE TOGGLE: 1 = Half-Life footstep/jump/landing sounds for the player, 0 = vanilla
bHalfLifeSounds=1
; 0 = match iMode (HL1 mode -> HL1 sounds, HL2 mode -> HL2 sounds, Vanilla -> no HL sounds)
; 1 = always Half-Life 1 sounds, 2 = always Half-Life 2 sounds (also works with iMode=0)
iSoundSet=0
; Sounds by surface: which game's footsteps play on each surface.
; 0 = the sound set above, 1 = Half-Life 1, 2 = Half-Life 2. If that game has no files for it, the sound set is used.
; Concrete and stone: HL1: its normal step. HL2: concrete.
iSurfaceConcrete=0
; Metal: HL1 and HL2: metal.
iSurfaceMetal=0
; Grates and chain-link: HL1: grate. HL2: metal grate and chain-link.
iSurfaceGrate=0
; Thin metal and ducts: HL1: vent. HL2: duct.
iSurfaceDuct=0
; Wood: HL1 has no wood sounds (its normal step, as in the original). HL2: wood.
iSurfaceWood=0
; Wood panels and planks: HL1 has no wood sounds (its normal step). HL2: wood panel.
iSurfaceWoodPanel=0
; Tile, glass and ice: HL1 and HL2: tile.
iSurfaceTile=0
; Dirt and soil: HL1 and HL2: dirt.
iSurfaceDirt=0
; Grass: HL1: dirt (no grass sounds). HL2: grass.
iSurfaceGrass=0
; Gravel: HL1: dirt (no gravel sounds). HL2: gravel.
iSurfaceGravel=0
; Mud: HL1: dirt (no mud sounds). HL2: mud.
iSurfaceMud=0
; Sand: HL1: dirt (no sand sounds). HL2: sand.
iSurfaceSand=0
; Snow: HL1: dirt. HL2: gravel (neither game has snow steps).
iSurfaceSnow=0
; Carpet and cloth: HL1: its normal step. HL2: soft shoe.
iSurfaceCarpet=0
; Shallow water: HL1 and HL2: slosh and wade.
iSurfaceWater=0
; Swimming: HL1: swim. HL2: wade (HL2 has no swim strokes).
iSurfaceSwim=0
; Power Armor steps: HL1 has no boots sound (the floor's own sound). HL2: hard boots. Needs 'Power Armor boots' on.
iSurfacePowerArmor=0
; Mute the player's vanilla footsteps while Half-Life sounds are on (NPCs are never touched)
bMuteVanillaPlayerFootsteps=1
; Third person: 0 = Half-Life's step timing, 1 = steps follow your walking animation's footfalls
; (matches any animation mod; needs the line above)
iThirdPersonSteps=1
; Floor sound when you jump and land, like Half-Life
bJumpLandSounds=1
; Slosh / wade sounds in shallow water
bWaterSounds=1
; Half-Life swimming and breathing sounds: getting in and out of water, holding jump in water,
; HL1 underwater bubbles, gasping for air after a long dive, drowning (when Fallout's drowning hurts you).
; HL2 needs pl_drown1-3 and wade5-8 (its swim sounds) in the HL2 folder.
bSwimSounds=1
; HL2 only: the suit's sprint sound (suit_sprint.wav) when you start sprinting
bSprintSound=1
; Half-Life 2 only: Power Armor steps use the Combine "hardboot" sounds
bPowerArmorHardboot=1
; Fall pain sound on a hard fall: HL1 pl_fallpain3 (from 580 u/s), HL2 pl_fallpain1/3 (from 526.5 u/s)
bHL1FallPainSound=1
; Give the Half-Life sounds the same reverb/distance settings as vanilla footsteps (incl. reverb mods)
bUseVanillaReverb=1

; Volume of all Half-Life sounds (1.0 = as loud as Half-Life plays them)
fVolume=1.0
; Half-Life's own step volumes
fRunVolume=0.5
fWalkVolume=0.2
fSneakVolumeMult=1.0
; Step timing (seconds), Half-Life's values
fRunStepInterval=0.3
fWalkStepInterval=0.4
fSneakExtraInterval=0.1
fWaterStepInterval=0.6
; Speed (Half-Life units/s) where steps switch to "running". 0 = automatic: Half-Life's own thresholds
; (HL1 210, HL2 220) scaled to your current walk/run/sprint speeds. In HL2 that means normal running uses
; walking steps and sprinting uses running steps, like HL2.
fRunStepSpeed=0
fMinStepSpeed=10
; Landing: falls faster than these (Half-Life units/s) make a sound
fLandSoftSpeed=150
fLandHardSpeed=350
fFallPainSpeed=580

; Surface -> sound. The log lists every Fallout material and what it uses.
; To change one, add a line: Material.<name from the log>=<sound>
; Sounds: concrete, metal, grate, chainlink, duct, wood, woodpanel, grass, gravel,
;         mud, sand, snow, dirt, tile, slosh, wade, carpet
; Example:
;Material.materialcarpet=carpet

[Advanced]
; Don't change unless told to.
fUnitScale=0.0254
iFileSoundFlags=0x1A
iFilePriority=1
