name: Build BHOP

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CommonLibF4 (supports Fallout 4 1.11.240)
        shell: pwsh
        run: |
          git clone --recurse-submodules https://github.com/libxse/commonlibf4 lib/commonlibf4
          cd lib/commonlibf4
          git checkout 7c8c6f8a349ac85abf6fc8a7e5a71732d9339954
          git submodule update --init --recursive

      - name: Set up xmake
        id: xmake
        continue-on-error: true
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Set up xmake (fallback if the step above failed)
        if: steps.xmake.outcome == 'failure'
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            try { choco install xmake -y --no-progress; if ($LASTEXITCODE -eq 0) { $ok = $true } } catch { Write-Host $_ }
            if (-not $ok) {
              try { Invoke-Expression (Invoke-WebRequest 'https://xmake.io/psget.text' -UseBasicParsing).Content; $ok = $true } catch { Write-Host $_ }
            }
            if (-not $ok) { Write-Host "xmake download failed (try $i), retrying..."; Start-Sleep -Seconds 30 }
          }
          foreach ($d in @("$env:ProgramFiles\xmake", "$env:USERPROFILE\xmake", "$env:LOCALAPPDATA\xmake")) {
            if (Test-Path "$d\xmake.exe") { Add-Content $env:GITHUB_PATH $d; Write-Host "xmake at $d" }
          }
          if (-not $ok) { exit 1 }

      - name: Build
        shell: pwsh
        env:
          XSE_FO4_MODS_PATH: ${{ github.workspace }}\dist
        run: |
          xmake f -m releasedbg -y
          xmake build -y
          xmake install -y

      - name: Upload mod folder
        uses: actions/upload-artifact@v4
        with:
          name: BHOP
          path: |
            dist/**
            build/windows/x64/releasedbg/*.dll

      - name: Make release zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist | Select-Object FullName
          $root = Get-ChildItem dist -Directory | Select-Object -First 1
          Compress-Archive -Path (Join-Path $root.FullName '*') -DestinationPath "BHOP-${{ github.ref_name }}.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: B.H.O.P. ${{ github.ref_name }}
          prerelease: true
          overwrite_files: true
          files: BHOP-${{ github.ref_name }}.zip
          body: |
            Boston Hopping Overhaul Project - test build for Fallout 4 1.11.240 (F4SE 0.7.9).

            Install with your mod manager, or extract into the Fallout 4 folder.
            Requires F4SE and Address Library for F4SE Plugins.

            Half-Life sound files are not included; install your own copy into
            Data\Sound\FX\BHOP\HL1 and HL2 (see README).
